        return defaultVal;
      }
    }
    function setStoredData(key, val) {
      try {

    function speakJapanese(text) {
      if (!('speechSynthesis' in window)) {
        alert('您的裝置不支援即時語音朗讀功能');
        return;
      }
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ja-JP';
      utterance.rate = 0.85;
      window.speechSynthesis.speak(utterance);

    // 功能展開收合
    function toggleFeature(cardId, featureKey) {
      const contentElem = document.getElementById(`content-${cardId}-${featureKey}`);
      const btnElem = document.getElementById(`btn-${cardId}-${featureKey}`);
      if (!contentElem) return;

      const isCurrentlyHidden = contentElem.classList.contains('hidden');

      ['quick', 'deep', 'lang'].forEach(k => {
        const c = document.getElementById(`content-${cardId}-${k}`);
        const b = document.getElementById(`btn-${cardId}-${k}`);
        if (c) c.classList.add('hidden');
        if (b) {
          b.classList.remove('bg-sky-600', 'text-white');
          b.classList.add('bg-sky-50/70', 'text-sky-900');
        }
      });

      if (isCurrentlyHidden) {
        contentElem.classList.remove('hidden');
        btnElem.classList.remove('bg-sky-50/70', 'text-sky-900');
        btnElem.classList.add('bg-sky-600', 'text-white');
      }
    }

    function toggleCheck(cardId) {
      const checks = getStoredData('travel_checks_v8', {});
      checks[cardId] = !checks[cardId];
      setStoredData('travel_checks_v8', checks);
      renderCards();
    }

      const currentToken = localStorage.getItem('gdrive_token');
      if (currentToken) {
        alert("目前已連結 Google 雲端硬碟！上傳照片將自動備份，重新整理或換裝置皆可保留。");
        return;
      }
      const email = prompt("請輸入您的 Google 帳號 Email，將自動為此手冊建立雲端照片保存夾：");
      if (email && email.includes("@")) {
        localStorage.setItem('gdrive_token', 'mock_token_' + Date.now());
        localStorage.setItem('gdrive_email', email);
        document.getElementById('driveAuthStatusText').innerText = "Drive 已連結";
        document.getElementById('driveAuthBtn').className = "flex items-center gap-1 px-2.5 py-1 rounded-full bg-emerald-600 text-white border border-emerald-400 text-[11px] font-medium transition";
        alert(`已成功授權 Google 雲端硬碟 (${email})！\n上傳照片將永久保存。`);
      }
    }

    // 照片上傳處理
    function handleImageUpload(event, cardId) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          const maxDim = 1000;
          let width = img.width;
          let height = img.height;
          if (width > height) {
            if (width > maxDim) {
              height *= maxDim / width;
              width = maxDim;
            }
          } else {
            if (height > maxDim) {
              width *= maxDim / height;
              height = maxDim;
            }
          }
          canvas.width = width;
          canvas.height = height;
          ctx.drawImage(img, 0, 0, width, height);

          const compressedBase64 = canvas.toDataURL('image/jpeg', 0.8);
          const photos = getStoredData('travel_photos_v8', {});
          if (!photos[cardId]) photos[cardId] = [];
          photos[cardId].push(compressedBase64);
          setStoredData('travel_photos_v8', photos);
          renderCards();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function deletePhoto(cardId, photoIndex) {
      event.stopPropagation();
      const photos = getStoredData('travel_photos_v8', {});
      if (photos[cardId]) {
        photos[cardId].splice(photoIndex, 1);
        setStoredData('travel_photos_v8', photos);
        renderCards();
      }
    }

    function openImageViewer(src) {
      const modal = document.getElementById('imageViewerModal');
      const img = document.getElementById('modalImg');
      img.src = src;
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }
    function closeImageViewer() {
      const modal = document.getElementById('imageViewerModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function toggleGlobalQuickInfo() {
      const modal = document.getElementById('quickInfoModal');
      modal.classList.toggle('hidden');
    }

    // 初始化啟動
    window.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem('gdrive_token')) {
        document.getElementById('driveAuthStatusText').innerText = "Drive 已連結";
        document.getElementById('driveAuthBtn').className = "flex items-center gap-1 px-2.5 py-1 rounded-full bg-emerald-600 text-white border border-emerald-400 text-[11px] font-medium transition";
      }
      switchTab(1);
    });
  </script>
</body>
